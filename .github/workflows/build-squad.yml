name: Build Initial Squad

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Squad budget in £m"
        required: false
        default: "100.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode build-squad --budget ${{ github.event.inputs.budget }}
      - name: Commit initial squad
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/state.json
          git commit -m "Build initial squad [automated]"
          git push
