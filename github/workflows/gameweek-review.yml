name: Gameweek Review

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek number to review"
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --mode review --gameweek ${{ github.event.inputs.gameweek }}
      - name: Commit review log
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Log GW${{ github.event.inputs.gameweek }} review [automated]"
          git push
